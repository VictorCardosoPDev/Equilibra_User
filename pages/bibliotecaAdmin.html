            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Publicando...';
            btn.disabled = true;
            btn.classList.add('opacity-70');

            const success = await uploadPdf();

            if (!success) {
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-70');
                return;
            }

            btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Publicado!';
            btn.classList.remove('bg-primary');

                btn.innerHTML = originalText;
                btn.classList.remove('bg-green-600');

async function uploadPdf() {

    const pdfInput =
        document.getElementById("pdfInput");

    const file =
        pdfInput.files[0];

    if (!file) {

        alert("Selecione um PDF.");

        return false;
    }
    const extension =
    file.name.split(".").pop();

    const fileName =
        `${Date.now()}.${extension}`;

    const { data, error } =
        await supabaseClient.storage
            .from("biblioteca-pdfs")
            .upload(fileName, file);

    if (error) {

        console.error(error);

        alert("Erro ao enviar PDF.");

        return false;
    }


    const { data: publicUrlData } =
    supabaseClient.storage
        .from("biblioteca-pdfs")
        .getPublicUrl(fileName);

    const thumbnailUrl =
    await uploadThumbnail();
    console.log(
    "Thumbnail URL:",
    thumbnailUrl
);

    console.log("title:", document.getElementById("title"));
    console.log("autores:", document.getElementById("autores"));
    console.log("categoria:", document.getElementById("categoria"));
    console.log("resumo:", document.getElementById("resumo"));

    const title =
        document.getElementById("title").value;

    const autores =
        document.getElementById("autores").value;

    const categoria =
        document.getElementById("categoria").value;
    
    const tipo =
    document.querySelector(
        'input[name="content_type"]:checked'
    )?.value || "";

    const resumo =
        document.getElementById("resumo").value;

    const { error: insertError } =
        await supabaseClient
            .from("conteudos")
            .insert({
                title,
                autores,
                categoria,
                tipo,
                resumo,
                thumbnail_url: thumbnailUrl,
                pdf_url: publicUrlData.publicUrl
            });

    if (insertError) {

        console.error(insertError);

        alert(
            "PDF enviado, mas houve erro ao salvar no banco."
        );

        return false;
    }

    alert("Conteúdo publicado com sucesso!");
    return true;
}
async function uploadThumbnail() {

    const thumbnailInput =
        document.getElementById("thumbnailInput");

    const file =
        thumbnailInput.files[0];

    if (!file) {

        console.log("Nenhuma thumbnail selecionada");

        return null;
    }

    const extension =
        file.name.split(".").pop();

    const fileName =
        `${Date.now()}.${extension}`;

    const { error } =
        await supabaseClient.storage
            .from("biblioteca-thumbnails")
            .upload(fileName, file);

    if (error) {

        console.error(
            "ERRO THUMBNAIL:",
            error
        );

        alert(
            "Erro ao enviar thumbnail: " +
            error.message
        );

        return null;
    }

    const { data } =
        supabaseClient.storage
            .from("biblioteca-thumbnails")
            .getPublicUrl(fileName);

    console.log(
        "Thumbnail enviada:",
        data.publicUrl
    );

    return data.publicUrl;
}
async function carregarConteudos() {

    const { data, error } =
        await supabaseClient
            .from("conteudos")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );
                console.log("DATA:", data);
                console.log("ERROR:", error);
    if (error) {

        return;
    }

    const table =
        document.getElementById(
            "conteudosTable"

    table.innerHTML = "";

    document.getElementById(
        "totalConteudos"

    data.forEach(

                    <span class="font-label-md text-on-surface">

                        ${conteudo.title}

                    <span class="text-xs text-outline">

                        ${conteudo.autores}

                    </span>

                </div>

            </td>

            <td class="px-6 py-4">

                <span class="px-3 py-1 rounded-full bg-secondary-fixed text-on-secondary-fixed-variant text-xs font-label-md">

                    ${conteudo.tipo}

                </span>

            </td>

            <td class="px-6 py-4">

                <span class="text-body-sm text-on-surface-variant">

            <td class="px-6 py-4 text-right">

                <div class="flex justify-end gap-2">

                    <a
                        href="${
                            conteudo.pdf_url

                        target="_blank"

                        <span class="material-symbols-outlined">

                    </a>
                    <button

                    </button>
                    <button

}
carregarConteudos();
async function excluirConteudo(id) {

    const confirmar =
        confirm(
            "Deseja realmente excluir este conteúdo?"
        );

    if (!confirmar) return;

    const { error } =
        await supabaseClient
            .from("conteudos")
            .delete()
            .eq("id", id);

    if (error) {

        console.error(error);

        alert(
            "Erro ao excluir conteúdo."
        );

        return;
    }

    alert(
        "Conteúdo excluído!"
    );

    carregarConteudos();
}
