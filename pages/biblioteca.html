        // Simple micro-interaction for category tabs
        const tabs = document.querySelectorAll('button.rounded-full');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.classList.remove('bg-primary', 'text-on-primary');
                    t.classList.add('bg-surface-container-low', 'text-on-surface-variant', 'border', 'border-outline-variant');
                });
                tab.classList.remove('bg-surface-container-low', 'text-on-surface-variant', 'border', 'border-outline-variant');
                tab.classList.add('bg-primary', 'text-on-primary');
            });
        });

        function filterContent(category) {

    const items =
        document.querySelectorAll(
            ".content-item"
        );

    items.forEach(item => {

        item.style.display = "none";

        if (category === "all") {

            item.style.display = "";

            return;
        }

        if (
            item.classList.contains(
                category
            )
        ) {

            item.style.display = "";
        }
    });
}

document.getElementById("filter-all")
    .addEventListener("click", () => filterContent("all"));

document.getElementById("filter-artigos")
    .addEventListener("click", () => filterContent("artigo"));

document.getElementById("filter-cartilhas")
    .addEventListener("click", () => filterContent("cartilha"));

document.getElementById("filter-saude")
    .addEventListener("click", () => filterContent("saude-mental"));

document.getElementById("filter-burnout")
    .addEventListener("click", () => filterContent("burnout"));

async function carregarBiblioteca() {

    const { data, error } =
        await supabaseClient
            .from("conteudos")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );

    if (error) {

        console.error(error);

        return;
    }

    const artigos =
        document.getElementById(
            "artigosContainer"
        );

    const cartilhas =
        document.getElementById(
            "cartilhasContainer"
        );

    artigos.innerHTML = "";
    cartilhas.innerHTML = "";

    data.forEach(item => {

        const card = `
        <details
            class="
                content-item
                ${(item.tipo || "")
                    .toLowerCase()}
                ${(item.categoria || "")
                    .toLowerCase()
                    .normalize('NFD')
                    .replace(/[\u0300-\u036f]/g, '')
                    .replaceAll(' ', '-')}
                group
                bg-surface-container-lowest
                border
                border-outline-variant
                rounded-xl
                overflow-hidden">

            <summary class="flex items-center justify-between p-4 cursor-pointer list-none">

                <div class="flex flex-col">

                    <span class="text-[10px] text-primary font-bold uppercase tracking-wider mb-1">

                        #${item.categoria}

                    </span>

                    <h4 class="font-label-md text-on-surface">

                        ${item.title}

                    </h4>

                </div>

                <span class="material-symbols-outlined">

                    expand_more

                </span>

            </summary>

            <div class="p-4 pt-0 border-t border-outline-variant/30">

                <div class="flex flex-col md:flex-row gap-4 mt-4">

                    <img
                        src="${item.thumbnail_url}"
                        class="w-full md:w-32 h-32 object-cover rounded-lg">

                    <div class="flex-1 flex flex-col">

                        <p class="font-body-md text-sm text-on-surface-variant mb-4">

                            ${item.resumo}

                        </p>

                        <div class="mt-auto flex items-center justify-between">

                            <span class="text-xs text-outline">

                                ${item.autores}

                            </span>

                            <a
                                href="${item.pdf_url}"
                                target="_blank"
                                class="bg-primary text-on-primary px-4 py-2 rounded-lg text-sm">

                                Ler Agora

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </details>
        `;

        if (
            item.tipo
                .toLowerCase()
                .includes(
                    "cartilha"
                )
        ) {

            cartilhas.innerHTML += card;

        } else {

            artigos.innerHTML += card;
        }
    });
}
carregarBiblioteca();

</script>
